<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><title>Tetris</title><link rel="stylesheet" href="styles/style.min.css"><link rel="icon" href="assets/images/favicon.png"></head>
<body>
<div id="wrapper"></div>
<script>
// WASD to Arrow keys mapping
(function() {
  var originalAddEventListener = document.addEventListener;
  document.addEventListener = function(type, listener, options) {
    if (type === 'keydown' || type === 'keyup') {
      var wrappedListener = function(e) {
        if (e.code === 'KeyW') { e.preventDefault(); e.stopPropagation(); Object.defineProperty(e, 'code', { value: 'ArrowUp' }); }
        else if (e.code === 'KeyS') { e.preventDefault(); e.stopPropagation(); Object.defineProperty(e, 'code', { value: 'ArrowDown' }); }
        else if (e.code === 'KeyA') { e.preventDefault(); e.stopPropagation(); Object.defineProperty(e, 'code', { value: 'ArrowLeft' }); }
        else if (e.code === 'KeyD') { e.preventDefault(); e.stopPropagation(); Object.defineProperty(e, 'code', { value: 'ArrowRight' }); }
        listener.call(this, e);
      };
      return originalAddEventListener.call(document, type, wrappedListener, options);
    }
    return originalAddEventListener.call(document, type, listener, options);
  };
})();
</script>
<script>
(function() {
  var controlMode = 'swipe';
  var dpadEl = null;
  var lastScore = 0;

  function injectKeyEvent(key, type) {
    var evt = new KeyboardEvent(type, { key: key, code: key, bubbles: true, cancelable: true });
    document.dispatchEvent(evt);
  }

  function createDpad() {
    if (dpadEl) return;
    dpadEl = document.createElement('div');
    dpadEl.id = 'virtual-dpad';
    dpadEl.innerHTML = '<div class="dpad-row"><button data-key="ArrowUp">▲</button></div>' +
      '<div class="dpad-row"><button data-key="ArrowLeft">◀</button><button data-key="ArrowDown">▼</button><button data-key="ArrowRight">▶</button></div>' +
      '<div class="dpad-row"><button data-key="Space">DROP</button></div>';
    dpadEl.style.cssText = 'position:fixed;bottom:80px;right:15px;z-index:99999;display:flex;flex-direction:column;align-items:center;gap:5px;';
    var style = document.createElement('style');
    style.textContent = '#virtual-dpad button{width:50px;height:50px;background:rgba(0,255,65,0.2);border:2px solid #00ff41;color:#00ff41;font-size:18px;border-radius:8px;cursor:pointer;touch-action:none;}#virtual-dpad .dpad-row{display:flex;gap:5px;}';
    dpadEl.appendChild(style);
    document.body.appendChild(dpadEl);

    dpadEl.querySelectorAll('button').forEach(function(btn) {
      btn.addEventListener('touchstart', function(e) { e.preventDefault(); injectKeyEvent(btn.dataset.key, 'keydown'); });
      btn.addEventListener('touchend', function(e) { e.preventDefault(); injectKeyEvent(btn.dataset.key, 'keyup'); });
      btn.addEventListener('mousedown', function(e) { injectKeyEvent(btn.dataset.key, 'keydown'); });
      btn.addEventListener('mouseup', function(e) { injectKeyEvent(btn.dataset.key, 'keyup'); });
    });
  }

  function removeDpad() {
    if (dpadEl) { dpadEl.remove(); dpadEl = null; }
  }

  // Score syncing with parent (T2E Arena)
  function checkScoreSync() {
    var main = window.main;
    if (!main) return;
    var playing = main.currentGameState;
    if (playing && playing.stats) {
      var currentScore = playing.stats.score || 0;
      if (currentScore !== lastScore) {
        lastScore = currentScore;
        if (window.parent !== window) {
          window.parent.postMessage({ type: 'SCORE_UPDATE', score: currentScore }, '*');
        }
      }
    }
  }

   setInterval(checkScoreSync, 200);

   window.addEventListener('message', function(e) {
     if (!e.data || !e.data.type) return;

     // CHAOS_BOMB - Limpia tablero + 500 puntos + animación
     if (e.data.type === 'CHAOS_BOMB') {
       console.log('[Tetris] CHAOS_BOMB recibido - ejecutando');
       var main = window.main;
       if (main && main.currentGameState && main.currentGameState.arena) {
         // Limpiar arena
         var arena = main.currentGameState.arena;
         for (var y = 0; y < arena.length; y++) {
           for (var x = 0; x < arena[y].length; x++) {
             arena[y][x] = 0;
           }
         }
         // Forzar redraw
         if (main.currentGameState.board) {
           main.currentGameState.board.isBufferDirty = true;
         }
         // +500 puntos
         if (main.currentGameState.stats) {
           main.currentGameState.stats.score += 500;
           console.log('[Tetris] Score +500 ->', main.currentGameState.stats.score);
         }
       }
       // Notificar al padre
       if (window.parent !== window) {
         window.parent.postMessage({ type: 'BOOST_USED' }, '*');
       }
       // Animación bomba
       showBombAnimation();
     }
   });

   function showBombAnimation() {
     try {
       var bombWrap = document.createElement('div');
       bombWrap.style.cssText = 'position:fixed;top:0;left:0;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;z-index:9999;pointer-events:none;';
       var bomb = document.createElement('div');
       bomb.textContent = '💣';
       bomb.style.cssText = 'font-size:20vh;opacity:1;transform:scale(0.1);filter:brightness(1.2) drop-shadow(0 0 12px cyan);transition:all 0.3s cubic-bezier(0.25,1,0.5,1), opacity 0.7s ease-out;';
       bombWrap.appendChild(bomb);
       document.body.appendChild(bombWrap);
       setTimeout(function(){ bomb.style.transform = 'scale(8)'; bomb.style.filter = 'brightness(2.5) drop-shadow(0 0 40px magenta) saturate(2)'; }, 20);
       setTimeout(function(){ bomb.style.opacity = '0'; }, 350);
       setTimeout(function(){ bombWrap.remove(); }, 900);
       console.log('[Tetris] Animación bomba ejecutada');
     } catch (ex) { console.error('[Tetris] Error anim:', ex); }
   }
})();
</script>
<script src="scripts/script.min.js"></script>
<script>
// CHAOS_BOMB Fallback Handler - ejecuta la lógica si falla el listener principal
window.addEventListener('message', function(e) {
    if (e.data && e.data.type === 'CHAOS_BOMB') {
        console.log('[Tetris Fallback] CHAOS_BOMB ejecutando manualmente');
        // Esperar a que window.main esté listo
        if (!window.main) {
            setTimeout(function() {
                if (window.main && window.main.currentGameState) {
                    executeChaosLogic();
                }
            }, 100);
        } else {
            executeChaosLogic();
        }
    }
});

function executeChaosLogic() {
    var main = window.main;
    if (!main || !main.currentGameState) return;

    // Limpiar tablero
    if (main.currentGameState.arena) {
        var arena = main.currentGameState.arena;
        for (var y = 0; y < arena.length; y++) {
            for (var x = 0; x < arena[y].length; x++) {
                arena[y][x] = 0;
            }
        }
        if (main.currentGameState.board) {
            main.currentGameState.board.isBufferDirty = true;
        }
        console.log('[Tetris Fallback] Tablero limpiado');
    }

    // Notificar boost usado
    if (window.parent !== window) {
        window.parent.postMessage({ type: 'BOOST_USED' }, '*');
    }

    // Animación de bomba
    try {
        var bombWrap = document.createElement('div');
        bombWrap.style.cssText = 'position:fixed;top:0;left:0;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;z-index:2147483647;pointer-events:none;';
        var bomb = document.createElement('div');
        bomb.textContent = '💣';
        bomb.style.cssText = 'font-size:25vh;opacity:1;transform:scale(0.1);filter:brightness(1.2) drop-shadow(0 0 12px cyan);';
        bombWrap.appendChild(bomb);
        document.body.appendChild(bombWrap);
        setTimeout(function(){ bomb.style.cssText = 'font-size:25vh;opacity:1;transform:scale(8) rotate(5deg);filter:brightness(2.5) drop-shadow(0 0 40px magenta);transition:all 0.3s ease;'; }, 20);
        setTimeout(function(){ bomb.style.opacity = '0'; }, 350);
        setTimeout(function(){ bombWrap.remove(); }, 900);
        console.log('[Tetris Fallback] Animación bomba ejecutada');
    } catch (ex) { console.error('[Tetris] Error anim:', ex); }
}
</script></body></html>
