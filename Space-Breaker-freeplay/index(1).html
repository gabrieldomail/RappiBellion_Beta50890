<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="icon" href="./images/Galaga_Fighter.png" type="image/x-icon" />
    <link rel="stylesheet" type="text/css" href="styles/game.css">
    <!-- Orbitron: fuente HUD Rappibellion -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <title>Galaga</title>
  </head>
  <body id="body">
    <img class="logo" src="images/Galaga_logo.svg" title="Galaga Logo">

    <div id="game">
        <!-- Menú principal -->
        <div id="main-menu" class="screen active">
            <ul class="menu">
                <li><button id="id-new-game">Play&nbsp;Game</button></li>
                <li><button id="id-high-scores">High&nbsp;Scores</button></li>
                <li><button id="id-help">Options</button></li>
                <li><button id="id-about">Credits</button></li>
            </ul>
        </div>

        <!-- Juego -->
        <div id="game-play" class="screen">
            <canvas id="id-canvas" class="canvas" width="1200" height="1600"></canvas>
        </div>

        <!-- High Scores -->
        <div id="high-scores" class="screen">
            <h1>High Scores</h1>
            <ol id="high-score-list"></ol>
            <ul class="menu">
                <li><button id="id-reset-high-scores" onclick="resetHighScores()" type="button">Reset Scores</button></li>
                <li><button id="id-high-scores-back">Back</button></li>
            </ul>
        </div>

        <!-- Options -->
        <div id="help" class="screen">
            <h1>Options</h1>
            <p>Move Left: <a id="move-left-btn" href="#">A or &#8592;</a></p>
            <p>Move Right: <a id="move-right-btn" href="#">D or &#8594;</a></p>
            <p>Fire Torpedo: <a id="fire-torpedo-btn" href="#">Spacebar</a></p>
            <p>Classic Torpedo Limit:
                <label class="switch">
                    <input type="checkbox" id="torpedo-limit-toggle">
                    <span class="slider round"></span>
                </label>
            </p>
            <ul class="menu">
                <li><button id="resetOptions" onclick="resetOptions()">Reset</button></li>
                <li><button id="id-help-back">Back</button></li>
            </ul>
        </div>

        <!-- Credits -->
        <div id="about" class="screen">
            <h1>Credits</h1>
            <p>Josh Williams</p>
            <p>Based on Galaga by Namco</p>
            <p style="margin-top:14px; opacity:0.45; font-size:10px; letter-spacing:0.3em;">
                VISUAL FX — RAPPIBELLION
            </p>
            <ul class="menu">
                <li><button id="id-about-back">Back</button></li>
            </ul>
        </div>
    </div>

    <!-- Controles móviles -->
    <div id="mobile-controls">
        <input id="mobile-movement" type="range" min="0" max="100" value="50">
        <button id="mobile-fire">&#9654;</button>
    </div>

    <!-- ══════════════════════════════════════════════════════════════════
         SCRIPTS — orden de carga obligatorio
         1. Namespace global
         2. Sistemas base (sin dependencias entre sí)
         3. Recursos
         4. Motor visual (render.js debe ir ANTES que update.js porque
            update.js referencia NeonFX que vive en render.js)
         5. Lógica de juego
         6. Persistencia
         7. Páginas / menús
         8. Gameplay (depende de todo lo anterior)
    ════════════════════════════════════════════════════════════════════ -->

    <!-- 1. Namespace -->
    <script>
        let MyGame = {
            screens : {},
            input:    {},
            objects:  {},
            render:   []
        };
        // Variable global de attract mode requerida por gameplay.js
        var attractMode = false;
    </script>

    <!-- 2. Sistemas base -->
    <script src="scripts/systems/math.js"></script>
    <script src="scripts/systems/input-keyboard.js"></script>
    <script src="scripts/systems/particles.js"></script>
    <script src="scripts/systems/pathing.js"></script>

    <!-- 3. Recursos -->
    <script src="scripts/systems/loadImages.js"></script>
    <script src="scripts/systems/loadSounds.js"></script>

    <!-- 4. Motor visual — NeonFX vive aquí, debe cargar antes que update -->
    <script src="scripts/render.js"></script>

    <!-- 5. Lógica de juego -->
    <script src="scripts/update.js"></script>
    <script src="scripts/stages.js"></script>

    <!-- 6. Persistencia -->
    <script src="scripts/systems/savescores.js"></script>
    <script src="scripts/systems/saveOptions.js"></script>

    <!-- 7. Core del motor de pantallas -->
    <script src="scripts/pages/game.js"></script>

    <!-- 8. Páginas / menús -->
    <script src="scripts/pages/mainmenu.js"></script>
    <script src="scripts/pages/highscores.js"></script>
    <script src="scripts/pages/help.js"></script>
    <script src="scripts/pages/about.js"></script>

    <!-- 9. Gameplay (depende de absolutamente todo lo anterior) -->
    <script src="scripts/gameplay.js"></script>

    <!-- ══ Inicialización ══════════════════════════════════════════════ -->
    <script>
        window.addEventListener('load', function() {
            try {
                // game.js expone MyGame.game con initialize() y showScreen()
                MyGame.game.initialize();

                // Mostrar menú principal (ya tiene clase .active en el HTML,
                // pero lo forzamos por si game.js lo quitó)
                MyGame.game.showScreen('main-menu');

                console.log('%cGALAGA // NeonFX OK', 'color:#00BCFF; font-family:monospace; font-size:14px;');
            } catch(e) {
                console.error('Error al iniciar Galaga:', e);
            }
        });
    </script>

  </body>
</html>
