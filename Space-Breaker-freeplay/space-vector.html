<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>SPACE BREAKER // NEON VECTOR 2026</title>
<link rel="icon" type="image/png" href="images/Galaga_Fighter.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: #02030a;
    overflow: hidden;
    font-family: 'Share Tech Mono', monospace;
    touch-action: none;
    overscroll-behavior: none;
  }
  #game {
    display: block;
    width: 100vw; height: 100vh;
    background: #02030a;
    outline: none;
  }
  #splash {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 14px;
    background: #02030a;
    color: #3ef0ff;
    letter-spacing: 0.2em;
    z-index: 10;
  }
  #splash .t1 { font-family: 'Orbitron', monospace; font-weight: 900; font-size: 28px; text-shadow: 0 0 18px #3ef0ff; }
  #splash .t2 { font-size: 13px; color: #587; animation: bl 1s steps(2) infinite; }
  @keyframes bl { 50% { opacity: 0.25; } }
  /* arena iframe mode (same convention as the legacy shell) */
  body._iframe-mode #game { object-fit: contain; }
</style>
</head>
<body>
  <div id="splash">
    <div class="t1">SPACE BREAKER</div>
    <div class="t2">BOOTING NEON VECTOR CORE…</div>
  </div>
  <canvas id="game" width="1200" height="1600" tabindex="0"></canvas>
  <script>
    // iframe detection (arena embed) — mirrors the legacy shell behavior
    try {
      if (window.self !== window.top) document.body.classList.add('_iframe-mode');
    } catch (e) { document.body.classList.add('_iframe-mode'); }
  </script>
  <script type="module" src="./source/main.js"></script>
</body>
</html>
